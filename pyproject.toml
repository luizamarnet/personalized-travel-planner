[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "travel-agent"
version = "0.1.0"
description = "A Gradio app for discovering travel activities and collecting user preferences."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gradio==6.32.0",
    "tavily-python>=0.5.0",
    "openai>=1.50.0",
    "pydantic>=2.11.10,<=2.12.5",
    "python-dotenv>=1.0.0",
    "langchain>=1.5.0",
    "langchain-azure-ai>=1.3.1",
    "azure-identity>=1.27.0",
    "langchain-openai>=1.7.4",
    "requests>=2.32.0",
    "dotenv>=0.9.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
